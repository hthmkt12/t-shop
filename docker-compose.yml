version: '3'

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - '3000:3000'
    volumes:
      - ./media:/app/media
    depends_on:
      - mongo
    environment:
      - DATABASE_URI=mongodb://mongo:27017/payload-template-ecommerce
    env_file:
      - .env

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

volumes:
  data:
  node_modules:
