version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    volumes:
      - media_data:/home/node/app/media
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: payload-template-ecommerce
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  media_data:
